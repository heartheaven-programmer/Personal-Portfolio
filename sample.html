<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="style4.css">
    <script src="sample.js" defer></script>
</head>
<body>
    
    <div class="btnmode">
    <button id="dark">Dark Mode</button>
    <button id="light">Light Mode</button>
    </div>
   

    <h1>Student Registration Form</h1>
    <br>
    <div id="container">
    <div class="card" >

        <form id="studentForm">

            <label>First Name</label>
            <input type="text" id="firstName" required>
            <br><br>

            <label>Last Name</label>
            <input type="text" id="lastName" required>
            <br><br>

            <label>Student Number</label>
            <input type="text" id="studentNumber" required><br><br>

            <label>Course</label>
            <select id="course" required>
                <option value="BSIT">BSIT</option>
                <option value="BSCS">BSCS</option>
                <option value="BSTM">BSTM</option>
                <option value="BSHM">BSHM</option>
            </select>
            <br><br>
            
            <div class="btnsubmit">
            <button type="submit" >Register Student</button>
            </div>

        </form>
    </div>
    </div>
    <hr><br><br>

    <h2>Student List</h2>

    <table border="2" id="studentTable">
        <thead>
            <tr>
                <th>Student Number</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Course</th>
            </tr>
        </thead>

        <tbody id="studentList">
            <tr>
                <td>2026-001</td>
                <td>Heart Heaven</td>
                <td>Elbancol</td>
                <td>BSCS</td>
            </tr>

            <tr>
                <td>2026-002</td>
                <td>Avisha Mae</td>
                <td>Chavas</td>
                <td>BSCS</td>
            </tr>
        </tbody>
    </table>

        <p id="message"></p>

        <div>
            <button id="evenbtn">Even</button>
            <button id="oddbtn">Odd</button>
            <button id="hidebtn">Hide Student List</button>
            <button id="showbtn">Show Student List</button>
            
        </div>
</body>
</html>
