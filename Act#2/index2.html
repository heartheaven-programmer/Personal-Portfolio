<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        text-align: center;
        margin-top: 150px;
        font-family:'Courier New', Courier, monospace;
        background-color: rgb(231, 187, 202) ;
        display: flex;
        justify-content: center;
        
    }

    button{
        background-color: palevioletred;
        color: white;
        border: solid black 3px;
        padding: 15px 30px;
        border-radius: 15px ;
        text-decoration-color: black;
        font-family: 'Courier New', Courier, monospace;
        font-size: large;
        box-shadow: 0 5px 30px rgb(150, 94, 112);
       

    }

    button:hover{
        transform: translate3d(-2px);
        box-shadow: 0 4px 12px rgb(197, 80, 119);
        color: rgb(134, 74, 158);
    }

    .card{
        background-color: rgb(219, 198, 205);
        width: 380px;
        min-height: 380px;
        border-radius: 15px;
        box-shadow: 0 30px 60px rgb(133, 108, 116);

  
    }

    .card:hover{
        transform: translate3d(-2px);
        box-shadow: 0 4px 12px rgb(119, 67, 84);
    }


    #message{
        font-size: bold;
        margin-top: 30px;
    }

    #title{
        margin-top: 50px;
    }

    .content{
        text-align: left;
        padding-left: 30px;
    }

    .container{
        background-color: rgb(197, 133, 154);
        width: 300px;
        min-height: 100px;
        border-radius: 15px;
        display: flex;
        justify-content: left;
        margin-left: 40px;
        box-shadow: 0 5px 30px rgb(117, 93, 101);
        
    }

    
</style>
<body>
    <div class="card">
         <h1 id="title">JavaScript Demo</h1>

         <div class="container">
            <div class="content">
                 <p id="profile">Profile:</p>
                 <p id="grade">Grade:</p>
                 <p id="schedule">Schedule:</p>
            </div>
         </div>

        <p id="message">Waiting....</p>

        <button id="loadBtn">Load</button>

    </div>

    <script src="script2.js"></script>
</body>
</html>
